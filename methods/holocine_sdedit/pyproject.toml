[project]
name = "holocine-sdedit"
version = "0.1.0"
requires-python = "==3.11.*"
# Direct dependencies; everything else is locked in uv.lock.
# The HoloCine/ submodule (diffsynth) is imported from source, not installed.
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    # diffsynth imports PretrainedConfig from transformers.modeling_utils, removed in 5.x
    "transformers==4.57.6",
    "accelerate==1.14.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "protobuf==7.35.1",
    "einops==0.8.2",
    "ftfy==6.3.1",
    "imageio[ffmpeg]==2.37.4",
    "huggingface-hub==0.36.2",
    # other imports of diffsynth
    "modelscope==1.39.1",
    "controlnet-aux==0.0.7",
    "pandas==3.0.5",
    "pynvml==13.0.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
