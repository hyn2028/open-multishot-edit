[project]
name = "lucy-edit"
version = "0.1.0"
requires-python = "==3.11.*"
# Direct dependencies; everything else is locked in uv.lock.
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "diffusers==0.39.0",
    "transformers==5.14.1",
    "accelerate==1.14.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "ftfy==6.3.1",
    "imageio[ffmpeg]==2.37.4",
    "pillow==12.3.0",
    "huggingface-hub==1.26.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
